
services:
  mongodb:
    image: mongo:7.0
    container_name: noticeboard-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=digital_notice_board
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - noticeboard-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noticeboard-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/digital_notice_board
      - JWT_SECRET=noticeboard-secret-key-production-replace-me-12345
      - FRONTEND_ORIGIN=*
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - noticeboard-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: noticeboard-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - noticeboard-network

volumes:
  mongodb_data:
    driver: local

networks:
  noticeboard-network:
    driver: bridge
